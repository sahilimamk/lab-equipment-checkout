services:
  - type: web
    name: lab-equipment-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lab-checkout-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
  - type: web
    name: lab-equipment-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://lab-equipment-api.onrender.com

databases:
  - name: lab-checkout-db
    plan: free
