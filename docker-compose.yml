services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab_checkout_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first start, on an empty volume:
      - ./backend/db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./backend/db/seeds/seed.sql:/docker-entrypoint-initdb.d/002_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab_checkout_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://lab:lab@db:5432/lab_checkout_dev
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    # Run the API too with: docker compose --profile with-api up --build
    profiles: ["with-api"]

volumes:
  pgdata:
